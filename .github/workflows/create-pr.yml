name: Create PR for formatted branch

on:
  push:
    branches: [ '**' ]

jobs:
  create-pr:
    runs-on: ubuntu-latest
    if: github.ref_type == 'branch' && github.ref != 'refs/heads/main'

    steps:
      - name: Create PR if missing
        env:
          GITHUB_API: https://api.github.com
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          owner=$(echo "$REPO" | cut -d'/' -f1)
          repo=$(echo "$REPO" | cut -d'/' -f2)

          echo "Checking for existing PR from $BRANCH to main in $REPO"
          existing=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" "$GITHUB_API/repos/$owner/$repo/pulls?head=$owner:$BRANCH&base=main")
          if echo "$existing" | grep -q '"number"'; then
            echo "PR already exists. Exiting."
            exit 0
          fi

          echo "Creating PR from $BRANCH -> main"
          title="ci: autoformat branch $BRANCH"
          body="Automated PR created by CI: applies formatting and lint fixes on branch $BRANCH.\n\nIf acceptable, merge this PR.\n\nCo-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"

          create_resp=$(curl -s -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Content-Type: application/json" \
            -d "{\"title\": \"$title\", \"head\": \"$BRANCH\", \"base\": \"main\", \"body\": \"$body\"}" \
            "$GITHUB_API/repos/$owner/$repo/pulls")

          echo "Create response: $create_resp"
