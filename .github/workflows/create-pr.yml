name: Create PR for pushed branch

on:
  push:
    branches: [ '**' ]

jobs:
  create-pr:
    runs-on: ubuntu-latest
    if: github.ref_type == 'branch' && github.ref != 'refs/heads/main' && !startsWith(github.ref_name, 'autoformat/')

    steps:
      - name: Create PR if missing
        env:
          GITHUB_API: https://api.github.com
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner=$(echo "$REPO" | cut -d'/' -f1)
          repo=$(echo "$REPO" | cut -d'/' -f2)

          echo "Checking for existing PR from $BRANCH to main in $REPO"
          existing=$(curl -s -H "Authorization: Bearer $TOKEN" "$GITHUB_API/repos/$owner/$repo/pulls?head=$owner:$BRANCH&base=main")
          if echo "$existing" | jq -e 'length > 0' >/dev/null 2>&1; then
            echo "PR already exists. Exiting."
            exit 0
          fi

          echo "Creating PR from $BRANCH -> main"
          title="ci: autoformat branch $BRANCH"
          body="Automated PR created by CI: applies formatting and lint fixes on branch $BRANCH."

          payload=$(jq -n --arg title "$title" --arg head "$BRANCH" --arg base "main" --arg body "$body" '{title: $title, head: $head, base: $base, body: $body}')
          create_resp=$(curl -s -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "$payload" "$GITHUB_API/repos/$owner/$repo/pulls")
          echo "Create response: $create_resp"
